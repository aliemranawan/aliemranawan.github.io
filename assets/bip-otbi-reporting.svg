<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="560" fill="#1E2530"/>

  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#F5F4F1">BI Publisher and OTBI Reporting</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#8B93A1">EBS / Fusion data &#8594; two reporting paths &#8594; stakeholders</text>

  <!-- Data source -->
  <rect x="370" y="110" width="160" height="80" rx="8" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="450" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F4F1">EBS / Fusion</text>
  <text x="450" y="160" text-anchor="middle" font-size="12" fill="#C4C9D1">Finance &amp; Ops data</text>

  <!-- split arrows -->
  <line x1="420" y1="190" x2="240" y2="250" stroke="#C74634" stroke-width="2.5" marker-end="url(#a4)"/>
  <line x1="480" y1="190" x2="660" y2="250" stroke="#C74634" stroke-width="2.5" marker-end="url(#a4)"/>

  <!-- BI Publisher path -->
  <rect x="100" y="260" width="280" height="90" rx="8" fill="#151A21" stroke="#C74634" stroke-width="2"/>
  <text x="240" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">BI Publisher</text>
  <text x="240" y="312" text-anchor="middle" font-size="11.5" fill="#F5F4F1">Scheduled bursting reports</text>
  <text x="240" y="330" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Fixed layout, formatted output</text>

  <line x1="240" y1="350" x2="240" y2="400" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a4b)"/>

  <rect x="100" y="400" width="280" height="70" rx="8" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="240" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F5F4F1">Finance stakeholders</text>
  <text x="240" y="450" text-anchor="middle" font-size="11.5" fill="#8B93A1">Scheduled email / burst delivery</text>

  <!-- OTBI path -->
  <rect x="520" y="260" width="280" height="90" rx="8" fill="#151A21" stroke="#C74634" stroke-width="2"/>
  <text x="660" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">OTBI</text>
  <text x="660" y="312" text-anchor="middle" font-size="11.5" fill="#F5F4F1">Ad hoc dashboards</text>
  <text x="660" y="330" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Self-service exploration</text>

  <line x1="660" y1="350" x2="660" y2="400" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a4b)"/>

  <rect x="520" y="400" width="280" height="70" rx="8" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="660" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F5F4F1">Operations stakeholders</text>
  <text x="660" y="450" text-anchor="middle" font-size="11.5" fill="#8B93A1">Interactive, self-service views</text>

  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#8B93A1">Same source data, two delivery models chosen by audience need</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="#C74634"/>
    </marker>
    <marker id="a4b" markerWidth="10" markerHeight="10" refX="3" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L3,8 L6,0" fill="#8B93A1"/>
    </marker>
  </defs>
</svg>
