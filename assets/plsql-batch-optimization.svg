<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="560" fill="#1E2530"/>

  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#F5F4F1">PL/SQL Batch Optimization</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#8B93A1">Ghani Glass nightly batch &#8212; 24 hours to under 10 minutes</text>

  <!-- BEFORE column -->
  <text x="220" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">BEFORE</text>
  <rect x="60" y="120" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="220" y="151" text-anchor="middle" font-size="12.5" fill="#F5F4F1">Cursor loop, one row at a time</text>
  <line x1="220" y1="172" x2="220" y2="196" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="60" y="196" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="220" y="227" text-anchor="middle" font-size="12.5" fill="#F5F4F1">INSERT per row (context switch)</text>
  <line x1="220" y1="248" x2="220" y2="272" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="60" y="272" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="220" y="303" text-anchor="middle" font-size="12.5" fill="#F5F4F1">Per-row lookup SELECT</text>
  <line x1="220" y1="324" x2="220" y2="348" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="60" y="348" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="220" y="379" text-anchor="middle" font-size="12.5" fill="#F5F4F1">COMMIT after every row</text>
  <line x1="220" y1="400" x2="220" y2="424" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="60" y="424" width="320" height="60" rx="6" fill="#C74634"/>
  <text x="220" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F4F1">Runtime: 24 hours</text>

  <!-- AFTER column -->
  <text x="680" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">AFTER</text>
  <rect x="520" y="120" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="680" y="151" text-anchor="middle" font-size="12.5" fill="#F5F4F1">BULK COLLECT ... LIMIT 5000</text>
  <line x1="680" y1="172" x2="680" y2="196" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="520" y="196" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="680" y="227" text-anchor="middle" font-size="12.5" fill="#F5F4F1">FORALL bulk INSERT</text>
  <line x1="680" y1="248" x2="680" y2="272" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="520" y="272" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="680" y="303" text-anchor="middle" font-size="12.5" fill="#F5F4F1">Single MERGE (no per-row lookup)</text>
  <line x1="680" y1="324" x2="680" y2="348" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="520" y="348" width="320" height="52" rx="6" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="680" y="379" text-anchor="middle" font-size="12.5" fill="#F5F4F1">COMMIT every 5,000 rows</text>
  <line x1="680" y1="400" x2="680" y2="424" stroke="#8B93A1" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="520" y="424" width="320" height="60" rx="6" fill="#2E7D5B"/>
  <text x="680" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F4F1">Runtime: &lt; 10 minutes</text>

  <!-- Middle divider -->
  <line x1="450" y1="100" x2="450" y2="490" stroke="#2A313D" stroke-width="2"/>

  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#5A6472" font-family="monospace">github.com/aliemranawan/plsql-performance-tuning-templates</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="3" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L3,8 L6,0" fill="#8B93A1"/>
    </marker>
  </defs>
</svg>
