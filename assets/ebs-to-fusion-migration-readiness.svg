<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="560" fill="#1E2530"/>

  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#F5F4F1">EBS-to-Fusion Migration Readiness</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#8B93A1">Legacy interface mapping &#8594; selection decision &#8594; Fusion target</text>

  <!-- Legacy EBS box -->
  <rect x="40" y="120" width="220" height="110" rx="8" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="150" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#F5F4F1">Legacy EBS</text>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#C4C9D1">Interface Tables</text>
  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#C4C9D1">GL / AP / HR staging</text>
  <text x="150" y="208" text-anchor="middle" font-size="12" fill="#C4C9D1">Custom EBS objects</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="175" x2="330" y2="175" stroke="#C74634" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="450,110 590,175 450,240 310,175" fill="#1E2530" stroke="#C74634" stroke-width="2.5"/>
  <text x="450" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#F5F4F1">FBDI vs BICC</text>
  <text x="450" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#F5F4F1">vs HDL?</text>

  <!-- Arrow 2 -->
  <line x1="590" y1="175" x2="660" y2="175" stroke="#C74634" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Fusion target box -->
  <rect x="660" y="120" width="200" height="110" rx="8" fill="#151A21" stroke="#2A313D" stroke-width="1"/>
  <text x="760" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#F5F4F1">Fusion Cloud</text>
  <text x="760" y="172" text-anchor="middle" font-size="12" fill="#C4C9D1">Target business</text>
  <text x="760" y="188" text-anchor="middle" font-size="12" fill="#C4C9D1">objects</text>
  <text x="760" y="206" text-anchor="middle" font-size="12" fill="#C4C9D1">(Financials / HCM)</text>

  <!-- Decision branches -->
  <line x1="410" y1="225" x2="200" y2="330" stroke="#8B93A1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="450" y1="240" x2="450" y2="330" stroke="#8B93A1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="490" y1="225" x2="700" y2="330" stroke="#8B93A1" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- FBDI branch -->
  <rect x="70" y="330" width="260" height="130" rx="8" fill="#151A21" stroke="#C74634" stroke-width="1.5"/>
  <text x="200" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">FBDI</text>
  <text x="200" y="380" text-anchor="middle" font-size="11.5" fill="#F5F4F1">Financials, SCM, Projects</text>
  <text x="200" y="398" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Bulk historical / initial load</text>
  <text x="200" y="416" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Validated against staging</text>
  <text x="200" y="434" text-anchor="middle" font-size="11.5" fill="#C4C9D1">interface tables pre-load</text>

  <!-- BICC branch -->
  <rect x="320" y="330" width="260" height="130" rx="8" fill="#151A21" stroke="#C74634" stroke-width="1.5"/>
  <text x="450" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">BICC</text>
  <text x="450" y="380" text-anchor="middle" font-size="11.5" fill="#F5F4F1">Outbound extract only</text>
  <text x="450" y="398" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Scheduled / on-demand</text>
  <text x="450" y="416" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Feeds downstream reporting</text>
  <text x="450" y="434" text-anchor="middle" font-size="11.5" fill="#C4C9D1">and integration layers</text>

  <!-- HDL branch -->
  <rect x="570" y="330" width="260" height="130" rx="8" fill="#151A21" stroke="#C74634" stroke-width="1.5"/>
  <text x="700" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#C74634">HDL</text>
  <text x="700" y="380" text-anchor="middle" font-size="11.5" fill="#F5F4F1">HCM business objects</text>
  <text x="700" y="398" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Worker, assignment, comp</text>
  <text x="700" y="416" text-anchor="middle" font-size="11.5" fill="#C4C9D1">Only supported path for</text>
  <text x="700" y="434" text-anchor="middle" font-size="11.5" fill="#C4C9D1">most HCM objects</text>

  <!-- Footer note -->
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#8B93A1">Gap case: no clean Fusion equivalent &#8594; flexfield check or functional gap-analysis decision</text>
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#5A6472" font-family="monospace">github.com/aliemranawan/fbdi-hdl-migration-templates</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="#C74634"/>
    </marker>
  </defs>
</svg>
